<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coinbase Magician Manual Selected</title><style>body{margin:0;background:#05070d;color:#eef5ff;font-family:system-ui;padding:14px}.card{background:#111827;border:1px solid #314162;border-radius:16px;padding:12px;margin:10px 0}select,button{width:100%;padding:12px;margin:6px 0;border-radius:12px;background:#172033;color:#eef5ff;border:1px solid #314162;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;border-bottom:1px solid #ffffff18;padding:5px;font-variant-numeric:tabular-nums;font-size:12px}.good{color:#18e59a}.bad{color:#ff5f73}.warn{color:#ffd166}a{color:#62a8ff;font-weight:900;text-decoration:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><h1>Coinbase Magician — Manual Selected</h1><p><a href="./index.html">← Agent Page</a> &nbsp; <a href="./manual.html">Classic Manual Page</a></p><div class="card"><select id="pair"></select><select id="tf"><option value="5M">5 minute</option><option value="15M">15 minute</option><option value="1H">1 hour</option><option value="1D">1 day</option><option value="1W">1 week</option><option value="1M">1 month</option></select><button id="reload">Reload</button><h2 id="status">Loading</h2><div id="summary">—</div><div id="signal">—</div></div><div class="grid"><div class="card"><h2 class="good">Bids</h2><div class="row"><b>Price</b><b>Size</b><b>USD</b></div><div id="bids"></div></div><div class="card"><h2 class="bad">Asks</h2><div class="row"><b>Price</b><b>Size</b><b>USD</b></div><div id="asks"></div></div></div><div class="card"><h2>Wall Read</h2><div id="walls">—</div></div><div class="card"><h2>Manual Amounts</h2><div id="amounts">—</div></div><script>(()=>{const PAIRS=['BTC-USD','ETH-USD','SOL-USD','XLM-USD','DOGE-USD','SHIB-USD','XRP-USD','ADA-USD','AVAX-USD','LINK-USD','LTC-USD'];const BOOK='https://api.exchange.coinbase.com/products';let pair='SOL-USD';let lastPlan=null;const $=id=>document.getElementById(id);const usd=n=>Number.isFinite(n)?'$'+n.toLocaleString(undefined,{maximumFractionDigits:2}):'—';const fmt=n=>Number.isFinite(n)?n.toLocaleString(undefined,{maximumFractionDigits:8}):'—';const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;function init(){$('pair').innerHTML=PAIRS.map(p=>`<option ${p===pair?'selected':''}>${p}</option>`).join('');$('pair').onchange=()=>{pair=$('pair').value;load()};$('tf').onchange=load;$('reload').onclick=load;load();setInterval(load,3000)}async function load(){try{$('status').textContent='Loading';let r=await fetch(`${BOOK}/${pair}/book?level=2`,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let j=await r.json();let bids=(j.bids||[]).slice(0,50).map(x=>({p:+x[0],q:+x[1]}));let asks=(j.asks||[]).slice(0,50).map(x=>({p:+x[0],q:+x[1]}));render(bids,asks);$('status').textContent='Live'}catch(e){$('status').textContent='Book Error';$('summary').textContent=e.message}}function rows(a){return a.slice(0,12).map(x=>`<div class=row><span>${fmt(x.p)}</span><span>${fmt(x.q)}</span><span>${usd(x.p*x.q)}</span></div>`).join('')}function walls(levels,side){let base=avg(levels.slice(0,35).map(x=>x.p*x.q));return levels.slice(0,12).map((x,i)=>{let n=x.p*x.q,m=base?n/base:0,s=Math.round(Math.min(100,m*25+(i<5?18:8)));return{...x,n,m,s,side,type:s>=70?'REAL WALL / RAIL':s>=45?'WATCH WALL':'NORMAL'}}).sort((a,b)=>b.s-a.s)}function render(bids,asks){$('bids').innerHTML=rows(bids);$('asks').innerHTML=rows(asks);let bid=bids[0]?.p,ask=asks[0]?.p,mid=bid&&ask?(bid+ask)/2:null;$('summary').innerHTML=`Pair ${pair}<br>Bid ${fmt(bid)} / Ask ${fmt(ask)}<br>Mid ${fmt(mid)}<br>Timeframe ${$('tf').value}`;let bw=walls(bids,'BUY'),sw=walls(asks,'SELL'),all=[...bw.slice(0,5),...sw.slice(0,5)].sort((a,b)=>b.s-a.s);$('walls').innerHTML=all.map(w=>`<div class=row><span class="${w.side==='BUY'?'good':'bad'}">${w.side}</span><span>${w.type}</span><span>${w.s}%</span><span>${fmt(w.p)}</span><span>${usd(w.n)}</span><span>${w.m.toFixed(2)}x</span></div>`).join('');let imbalance=calcImb(bids,asks),action=imbalance>15?'WATCH BUY':imbalance<-15?'WATCH EXIT':'WAIT',conf=Math.min(100,Math.round(Math.abs(imbalance)+20));$('signal').innerHTML=`<h2 class="${action==='WATCH BUY'?'good':action==='WATCH EXIT'?'bad':'warn'}">${action}</h2>Confidence ${conf}%<br>Book imbalance ${imbalance.toFixed(2)}%`;lastPlan={action,bid,ask,mid};renderAmounts(ask,bid,action)}function calcImb(bids,asks){let bd=bids.slice(0,35).reduce((s,x)=>s+x.p*x.q,0),ad=asks.slice(0,35).reduce((s,x)=>s+x.p*x.q,0);return bd+ad?(bd-ad)/(bd+ad)*100:0}function renderAmounts(entryBid,exitBid,action){let entry=action==='WATCH EXIT'?exitBid:entryBid;let target=action==='WATCH EXIT'?entry*0.996:entry*1.006;let stop=action==='WATCH EXIT'?entry*1.003:entry*0.997;let amounts=[10,20,40,100,1000];$('amounts').innerHTML=amounts.map(a=>{let size=entry?a/entry:0,gain=(target-entry)*size,loss=(stop-entry)*size;let txt=`${pair}\n${action}\nAmount ${usd(a)}\nLimit ${fmt(entry)}\nSize ${fmt(size)}\nTarget ${fmt(target)}\nProjected P/L ${usd(gain)}\nStop ${fmt(stop)}\nRisk ${usd(loss)}`;return`<div class=card><b>${usd(a)}</b><br>Limit ${fmt(entry)}<br>Size ${fmt(size)}<br>Target ${fmt(target)}<br>P/L ${usd(gain)}<br>Risk ${usd(loss)}<button onclick="navigator.clipboard.writeText(decodeURIComponent('${encodeURIComponent(txt)}'))">Copy</button></div>`}).join('')}init()})();</script></body></html>
