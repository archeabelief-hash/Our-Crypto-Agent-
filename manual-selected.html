<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coinbase Magician Manual Selected</title><style>body{margin:0;background:#05070d;color:#eef5ff;font-family:system-ui;padding:14px}.card{background:#111827;border:1px solid #314162;border-radius:16px;padding:12px;margin:10px 0}select,button{width:100%;padding:12px;margin:6px 0;border-radius:12px;background:#172033;color:#eef5ff;border:1px solid #314162;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;border-bottom:1px solid #ffffff18;padding:5px;font-variant-numeric:tabular-nums;font-size:12px}.bookrow{position:relative;display:grid;grid-template-columns:1fr .8fr .9fr .95fr;gap:6px;border-bottom:1px solid #ffffff18;padding:7px 5px 7px 10px;font-variant-numeric:tabular-nums;font-size:12px;overflow:hidden}.bookrow:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#ffffff22}.bookrow.real-buy:before{background:#18e59a}.bookrow.real-sell:before{background:#ff5f73}.bookrow.watch:before{background:#ffd166}.bookrow.spoof:before{background:#ff9f43}.bookrow.bot:before{background:#62a8ff}.bookrow.real-buy{background:linear-gradient(90deg,#18e59a22,transparent 62%)}.bookrow.real-sell{background:linear-gradient(90deg,#ff5f7322,transparent 62%)}.bookrow.watch{background:linear-gradient(90deg,#ffd1661d,transparent 62%)}.bookrow.spoof{background:linear-gradient(90deg,#ff9f4322,transparent 62%)}.bookrow.bot{background:linear-gradient(90deg,#62a8ff22,transparent 62%)}.tag{display:inline-block;border-radius:999px;padding:2px 7px;font-size:10px;font-weight:900;white-space:nowrap}.t-real-buy{background:#18e59a22;color:#18e59a;border:1px solid #18e59a66}.t-real-sell{background:#ff5f7322;color:#ff5f73;border:1px solid #ff5f7366}.t-watch{background:#ffd16622;color:#ffd166;border:1px solid #ffd16666}.t-spoof{background:#ff9f4322;color:#ff9f43;border:1px solid #ff9f4366}.t-bot{background:#62a8ff22;color:#62a8ff;border:1px solid #62a8ff66}.good{color:#18e59a}.bad{color:#ff5f73}.warn{color:#ffd166}.blue{color:#62a8ff}a{color:#62a8ff;font-weight:900;text-decoration:none}.legend{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.read{font-size:12px;color:#cbd8f0;line-height:1.45}.wallcard{border:1px solid #ffffff18;border-radius:12px;padding:8px;margin:6px 0;background:#ffffff08}.bar{height:5px;background:#ffffff14;border-radius:999px;overflow:hidden;margin-top:6px}.fill{height:100%;border-radius:999px}.fill.buy{background:#18e59a}.fill.sell{background:#ff5f73}.fill.warn{background:#ffd166}.fill.bot{background:#62a8ff}.profit{color:#18e59a;font-weight:950}.loss{color:#ff5f73;font-weight:950}.flat{color:#ffd166;font-weight:950}.amount-card{background:#0d1628;border:1px solid #ffffff18;border-radius:14px;padding:12px;margin:10px 0}.amount-card.profit-card{border-color:#18e59a55;background:linear-gradient(90deg,#18e59a14,#0d1628 55%)}.amount-card.loss-card{border-color:#ff5f7355;background:linear-gradient(90deg,#ff5f7314,#0d1628 55%)}@media(max-width:700px){.grid{grid-template-columns:1fr}.bookrow{grid-template-columns:1fr .7fr .85fr .9fr}}</style></head><body><h1>Coinbase Magician — Manual Selected</h1><p><a href="./index.html">← Agent Page</a> &nbsp; <a href="./manual.html">Classic Manual Page</a></p><div class="card"><select id="pair"></select><select id="tf"><option value="5M">5 minute</option><option value="15M">15 minute</option><option value="1H">1 hour</option><option value="1D">1 day</option><option value="1W">1 week</option><option value="1M">1 month</option></select><button id="reload">Reload</button><h2 id="status">Loading</h2><div id="summary">—</div><div class="legend"><span class="tag t-real-buy">BUY WALL</span><span class="tag t-real-sell">SELL WALL</span><span class="tag t-watch">WATCH</span><span class="tag t-spoof">SPOOF WATCH</span><span class="tag t-bot">BOT LADDER</span></div><div id="signal">—</div></div><div class="grid"><div class="card"><h2 class="good">Bids</h2><div class="bookrow"><b>Price</b><b>Size</b><b>USD</b><b>Signal</b></div><div id="bids"></div></div><div class="card"><h2 class="bad">Asks</h2><div class="bookrow"><b>Price</b><b>Size</b><b>USD</b><b>Signal</b></div><div id="asks"></div></div></div><div class="card"><h2>Wall / Bot Read</h2><div class="read" id="bookRead">Loading book intelligence…</div><div id="walls">—</div></div><div class="card"><h2>Manual Amounts</h2><div id="amounts">—</div></div><script>(()=>{const PAIRS=['BTC-USD','ETH-USD','SOL-USD','XLM-USD','DOGE-USD','SHIB-USD','XRP-USD','ADA-USD','AVAX-USD','LINK-USD','LTC-USD'];const BOOK='https://api.exchange.coinbase.com/products';let pair='SOL-USD';const $=id=>document.getElementById(id);const usd=n=>Number.isFinite(n)?'$'+n.toLocaleString(undefined,{maximumFractionDigits:2}):'—';const fmt=n=>Number.isFinite(n)?n.toLocaleString(undefined,{maximumFractionDigits:8}):'—';const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;function init(){$('pair').innerHTML=PAIRS.map(p=>`<option ${p===pair?'selected':''}>${p}</option>`).join('');$('pair').onchange=()=>{pair=$('pair').value;load()};$('tf').onchange=load;$('reload').onclick=load;load();setInterval(load,3000)}async function load(){try{$('status').textContent='Loading';let r=await fetch(`${BOOK}/${pair}/book?level=2`,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let j=await r.json();let bids=(j.bids||[]).slice(0,60).map(x=>({p:+x[0],q:+x[1]}));let asks=(j.asks||[]).slice(0,60).map(x=>({p:+x[0],q:+x[1]}));render(bids,asks);$('status').textContent='Live'}catch(e){$('status').textContent='Book Error';$('summary').textContent=e.message}}function sizeKey(q){if(q>=1)return q.toFixed(2);if(q>=.01)return q.toFixed(4);return q.toFixed(6)}function repeats(levels){let f={};levels.slice(0,30).forEach(x=>{let k=sizeKey(x.q);f[k]=(f[k]||0)+1});return f}function classify(levels,side){let ns=levels.slice(0,35).map(x=>x.p*x.q),base=avg(ns),freq=repeats(levels);return levels.map((x,i)=>{let n=x.p*x.q,m=base?n/base:0,rep=freq[sizeKey(x.q)]||0,score=Math.round(Math.min(100,m*25+(i<5?18:8)+(rep>=3?18:0)));let label='NORMAL',kind='',tag='';if(m>=3.2&&i<=8){label=side==='BUY'?'BUY WALL':'SELL WALL';kind=side==='BUY'?'real-buy':'real-sell';tag=side==='BUY'?'t-real-buy':'t-real-sell'}else if(m>=2.1){label='WATCH WALL';kind='watch';tag='t-watch'}if(m>=2.6&&i>8){label='SPOOF WATCH';kind='spoof';tag='t-spoof'}if(rep>=3&&m<3.2){label='BOT LADDER';kind='bot';tag='t-bot'}return{...x,n,m,rep,score,label,kind,tag,side}})}function rows(marked){return marked.slice(0,14).map(x=>`<div class="bookrow ${x.kind}"><span>${fmt(x.p)}</span><span>${fmt(x.q)}</span><span>${usd(x.n)}</span><span>${x.label==='NORMAL'?'':`<span class="tag ${x.tag}">${x.label}</span>`}</span></div>`).join('')}function render(bids,asks){let bid=bids[0]?.p,ask=asks[0]?.p,mid=bid&&ask?(bid+ask)/2:null;let mb=classify(bids,'BUY'),ma=classify(asks,'SELL');$('bids').innerHTML=rows(mb);$('asks').innerHTML=rows(ma);$('summary').innerHTML=`Pair ${pair}<br>Bid ${fmt(bid)} / Ask ${fmt(ask)}<br>Mid ${fmt(mid)}<br>Timeframe ${$('tf').value}`;let bw=mb.filter(x=>x.label!=='NORMAL').slice(0,8),sw=ma.filter(x=>x.label!=='NORMAL').slice(0,8),all=[...bw,...sw].sort((a,b)=>b.score-a.score);$('walls').innerHTML=all.map(w=>`<div class="wallcard"><b class="${w.side==='BUY'?'good':'bad'}">${w.side} ${w.label}</b><br>Price ${fmt(w.p)} | Size ${fmt(w.q)} | ${usd(w.n)}<br>Score ${w.score}% | ${w.m.toFixed(2)}x local avg | Repeated size hits ${w.rep}<br><span class="read">${meaning(w)}</span><div class="bar"><div class="fill ${w.kind==='bot'?'bot':w.kind==='real-sell'?'sell':w.kind==='real-buy'?'buy':'warn'}" style="width:${Math.max(4,w.score)}%"></div></div></div>`).join('')||'<div class="read">No major walls or bot-ladder patterns in the top book right now.</div>';readout(mb,ma,bids,asks);let imbalance=calcImb(bids,asks),action=imbalance>15?'WATCH BUY':imbalance<-15?'WATCH EXIT':'WAIT',conf=Math.min(100,Math.round(Math.abs(imbalance)+20));$('signal').innerHTML=`<h2 class="${action==='WATCH BUY'?'good':action==='WATCH EXIT'?'bad':'warn'}">${action}</h2>Confidence ${conf}%<br>Book imbalance ${imbalance.toFixed(2)}%`;renderAmounts(ask,bid,action)}function meaning(w){if(w.label==='SPOOF WATCH')return 'Large liquidity deeper in book; treat as possible bait until it holds near price.';if(w.label==='BOT LADDER')return 'Repeated order size pattern; bots may be stepping liquidity through the book.';if(w.label==='BUY WALL')return 'Buyers are defending this level; possible support rail if it holds.';if(w.label==='SELL WALL')return 'Sellers are blocking this level; possible resistance rail if it holds.';return 'Meaningful liquidity worth watching.'}function readout(mb,ma,bids,asks){let topB=mb.find(x=>x.label!=='NORMAL'),topA=ma.find(x=>x.label!=='NORMAL'),bots=[...mb,...ma].filter(x=>x.label==='BOT LADDER').length,spoofs=[...mb,...ma].filter(x=>x.label==='SPOOF WATCH').length;$('bookRead').innerHTML=`Strongest buy signal: ${topB?`${topB.label} @ ${fmt(topB.p)} (${topB.score}%)`:'none'}.<br>Strongest sell signal: ${topA?`${topA.label} @ ${fmt(topA.p)} (${topA.score}%)`:'none'}.<br>Bot ladder markers: ${bots}. Spoof-watch markers: ${spoofs}.<br>These markers are snapshot-based from the public Coinbase book; trust improves when the same level persists across refreshes.`}function calcImb(bids,asks){let bd=bids.slice(0,35).reduce((s,x)=>s+x.p*x.q,0),ad=asks.slice(0,35).reduce((s,x)=>s+x.p*x.q,0);return bd+ad?(bd-ad)/(bd+ad)*100:0}function pnlClass(v){return v>0?'profit':v<0?'loss':'flat'}function cardClass(gain){return gain>=0?'profit-card':'loss-card'}function renderAmounts(entryBid,exitBid,action){let entry=action==='WATCH EXIT'?exitBid:entryBid;let target=action==='WATCH EXIT'?entry*0.996:entry*1.006;let stop=action==='WATCH EXIT'?entry*1.003:entry*0.997;let amounts=[10,20,40,100,1000];$('amounts').innerHTML=amounts.map(a=>{let size=entry?a/entry:0,gain=(target-entry)*size,loss=(stop-entry)*size;let txt=`${pair}\n${action}\nAmount ${usd(a)}\nLimit ${fmt(entry)}\nSize ${fmt(size)}\nTarget ${fmt(target)}\nProjected P/L ${usd(gain)}\nStop ${fmt(stop)}\nRisk ${usd(loss)}`;return`<div class="amount-card ${cardClass(gain)}"><b>${usd(a)}</b><br>Limit ${fmt(entry)}<br>Size ${fmt(size)}<br>Target ${fmt(target)}<br>P/L <span class="${pnlClass(gain)}">${usd(gain)}</span><br>Risk <span class="${pnlClass(loss)}">${usd(loss)}</span><button onclick="navigator.clipboard.writeText(decodeURIComponent('${encodeURIComponent(txt)}'))">Copy</button></div>`}).join('')}init()})();</script></body></html>
