name: Build Crypto Overlay APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-overlay/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: android-overlay
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CryptoOverlay-debug-apk
          path: android-overlay/app/build/outputs/apk/debug/app-debug.apk
