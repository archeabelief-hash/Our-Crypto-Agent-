<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manual Selected Staging</title><style>body{margin:0;background:#05070d;color:#eef5ff;font-family:system-ui;padding:14px}.card{background:#111827;border:1px solid #314162;border-radius:16px;padding:12px;margin:10px 0}select,button{width:100%;padding:12px;margin:6px 0;border-radius:12px;background:#172033;color:#eef5ff;border:1px solid #314162;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;border-bottom:1px solid #ffffff18;padding:5px;font-variant-numeric:tabular-nums;font-size:12px}.good{color:#18e59a}.bad{color:#ff5f73}.warn{color:#ffd166}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><h1>Manual Selected — Staging</h1><div class="card"><select id="pair"></select><select id="tf"><option value="5M">5 minute</option><option value="15M">15 minute</option><option value="1H">1 hour</option><option value="1D">1 day</option><option value="1W">1 week</option><option value="1M">1 month</option></select><button id="reload">Reload</button><h2 id="status">Loading</h2><div id="summary">—</div></div><div class="grid"><div class="card"><h2 class="good">Bids</h2><div id="bids"></div></div><div class="card"><h2 class="bad">Asks</h2><div id="asks"></div></div></div><div class="card"><h2>Wall Read</h2><div id="walls">—</div></div><script>(()=>{const PAIRS=['BTC-USD','ETH-USD','SOL-USD','XLM-USD','DOGE-USD','SHIB-USD','XRP-USD','ADA-USD','AVAX-USD','LINK-USD','LTC-USD'];const BOOK='https://api.exchange.coinbase.com/products';let pair='SOL-USD';const $=id=>document.getElementById(id);const usd=n=>Number.isFinite(n)?'$'+n.toLocaleString(undefined,{maximumFractionDigits:2}):'—';const fmt=n=>Number.isFinite(n)?n.toLocaleString(undefined,{maximumFractionDigits:8}):'—';const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;function init(){$('pair').innerHTML=PAIRS.map(p=>`<option ${p===pair?'selected':''}>${p}</option>`).join('');$('pair').onchange=()=>{pair=$('pair').value;load()};$('reload').onclick=load;load();setInterval(load,3000)}async function load(){try{$('status').textContent='Loading';let r=await fetch(`${BOOK}/${pair}/book?level=2`,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let j=await r.json();let bids=(j.bids||[]).slice(0,50).map(x=>({p:+x[0],q:+x[1]}));let asks=(j.asks||[]).slice(0,50).map(x=>({p:+x[0],q:+x[1]}));render(bids,asks);$('status').textContent='Live'}catch(e){$('status').textContent='Book Error';$('summary').textContent=e.message}}function rows(a){return a.slice(0,12).map(x=>`<div class=row><span>${fmt(x.p)}</span><span>${fmt(x.q)}</span><span>${usd(x.p*x.q)}</span></div>`).join('')}function walls(levels,side){let base=avg(levels.slice(0,35).map(x=>x.p*x.q));return levels.slice(0,12).map((x,i)=>{let n=x.p*x.q,m=base?n/base:0,s=Math.round(Math.min(100,m*25+(i<5?18:8)));return{...x,n,m,s,side,type:s>=70?'REAL WALL / RAIL':s>=45?'WATCH WALL':'NORMAL'}}).sort((a,b)=>b.s-a.s)}function render(bids,asks){$('bids').innerHTML=rows(bids);$('asks').innerHTML=rows(asks);let bid=bids[0]?.p,ask=asks[0]?.p,mid=bid&&ask?(bid+ask)/2:null;$('summary').innerHTML=`Pair ${pair}<br>Bid ${fmt(bid)} / Ask ${fmt(ask)}<br>Mid ${fmt(mid)}`;let all=[...walls(bids,'BUY').slice(0,5),...walls(asks,'SELL').slice(0,5)].sort((a,b)=>b.s-a.s);$('walls').innerHTML=all.map(w=>`<div class=row><span class="${w.side==='BUY'?'good':'bad'}">${w.side}</span><span>${w.type}</span><span>${w.s}%</span><span>${fmt(w.p)}</span><span>${usd(w.n)}</span><span>${w.m.toFixed(2)}x</span></div>`).join('')}}init()})();</script></body></html>
