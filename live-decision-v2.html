<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Trade Engine</title><style>body{margin:0;background:#05070d;color:#eef5ff;font-family:system-ui;padding:14px}.wrap{max-width:1180px;margin:auto}.card{background:#111827;border:1px solid #314162;border-radius:16px;padding:14px;margin:10px 0}.row,.links{display:flex;gap:8px;flex-wrap:wrap}.links a,a,button,select,input{background:#172033;color:#eef5ff;border:1px solid #314162;border-radius:12px;padding:10px 12px;font-weight:900;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.metric{background:#ffffff08;border:1px solid #ffffff12;border-radius:14px;padding:10px}.label{font-size:11px;color:#92a4c4}.value{font-size:19px;font-weight:950}.status{font-size:34px;font-weight:1000}.good{color:#18e59a}.bad{color:#ff5f73}.warn{color:#ffd166}.small{font-size:12px;color:#cbd8f0;line-height:1.45}.json{white-space:pre-wrap;word-break:break-word;background:#0006;border:1px solid #ffffff12;border-radius:12px;padding:10px;max-height:260px;overflow:auto;font-size:11px}table{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:12px}td,th{padding:8px;background:#ffffff08}th{text-align:left;color:#92a4c4}.ready td{border-top:1px solid #18e59a66;border-bottom:1px solid #18e59a66}.block td{border-top:1px solid #ff5f7366;border-bottom:1px solid #ff5f7366}@media(max-width:800px){.grid{grid-template-columns:1fr}.links a,button,select,input{width:100%}}</style></head><body><main class="wrap"><h1>AI Trade Engine</h1><div class="links"><a href="home.html">Home</a><a href="manual-trade.html">Manual Trade Card</a><a href="execution-tracker.html">Execution Tracker</a><a href="liquidity-pnl-engine.html">Liquidity PnL</a></div><section class="card"><h2>Controls</h2><div class="row"><select id="pair"><option>SOL-USD</option><option>BTC-USD</option><option>ETH-USD</option><option>XLM-USD</option><option>DOGE-USD</option><option>XRP-USD</option><option>ADA-USD</option><option>AVAX-USD</option><option>LINK-USD</option><option>LTC-USD</option></select><input id="amount" type="number" value="40" min="1" step="5"><select id="tier"><option value="0">Fee $0-$10K</option><option value="1">Fee $10K-$50K</option><option value="2">Fee $50K-$100K</option><option value="3">Fee $100K-$1M</option></select><button id="reload">Reload</button><button id="conn">Loading</button></div></section><section class="card"><h2>Best Decision</h2><div id="decision" class="status warn">LOADING</div><div id="reason" class="small">Loading Coinbase order book.</div><div class="grid"><div class="metric"><div class="label">Best TF</div><div id="tf" class="value">—</div></div><div class="metric"><div class="label">Entry</div><div id="entry" class="value">—</div></div><div class="metric"><div class="label">Target</div><div id="target" class="value good">—</div></div><div class="metric"><div class="label">Stop</div><div id="stop" class="value bad">—</div></div><div class="metric"><div class="label">Net</div><div id="net" class="value">—</div></div></div></section><section class="card"><h2>Execution Sniper</h2><div id="sniper" class="small">Learning entry quality.</div></section><section class="card"><h2>1M / 5M / 15M Scanner</h2><table><thead><tr><th>TF</th><th>Entry</th><th>Target</th><th>Stop</th><th>Net</th><th>Score</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></section><section class="card"><h2>Diagnostics</h2><div id="diag" class="small">—</div></section><section class="card"><h2>JSON</h2><pre id="json" class="json">{}</pre></section></main><script>(()=>{const API='https://api.exchange.coinbase.com/products';const FEES=[{m:.004,t:.006},{m:.0025,t:.004},{m:.0015,t:.0025},{m:.001,t:.002}];const TFS={"1M":.0015,"5M":.0035,"15M":.0075};const $=id=>document.getElementById(id);const fmt=n=>Number.isFinite(n)?n.toLocaleString(undefined,{maximumFractionDigits:Math.abs(n)>=1?6:8}):'—';const usd=n=>Number.isFinite(n)?'$'+n.toLocaleString(undefined,{maximumFractionDigits:2}):'—';const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));let mem=[];function avg(a){return a.length?a.reduce((s,x)=>s+x,0)/a.length:0}function depth(a,n=35){return a.slice(0,n).reduce((s,x)=>s+x.p*x.q,0)}function fill(asks,amt){let rem=amt,c=0,q=0;for(const x of asks){let n=x.p*x.q,t=Math.min(rem,n);q+=t/x.p;c+=t;rem-=t;if(rem<=0)break}return{ok:rem<=0,qty:q,avg:q?c/q:0}}function ctx(bids,asks){let bid=bids[0].p,ask=asks[0].p,mid=(bid+ask)/2,imb=(depth(bids)-depth(asks))/(depth(bids)+depth(asks))*100,sp=(ask-bid)/ask*100;mem.push({t:Date.now(),imb,mid,sp});mem=mem.filter(x=>Date.now()-x.t<90000).slice(-50);let aim=avg(mem.map(x=>x.imb)),asp=avg(mem.map(x=>x.sp))||sp,acc=mem.length>1?imb-mem[mem.length-2].imb:0,exh=mem.length>6?avg(mem.slice(0,3).map(x=>x.imb))-avg(mem.slice(-3).map(x=>x.imb)):0,quality=clamp(.5+(acc>0?.18:0)-(acc<0?.18:0)-(exh>4?.18:0)-((sp/asp)>1.2?.18:0),0,1);let verdict=quality>.68?'SNIPER READY':quality<.38?'DO NOT CHASE':'WAIT FOR CLEANER ENTRY';return{bid,ask,mid,imb,sp,avgIm:aim,avgSp:asp,momentum:imb-aim,spreadSpike:sp/Math.max(.0001,asp),sniper:{verdict,quality,acceleration:acc,exhaustion:exh,chaseRisk:1-quality}}}function pnl(amt,entry,target,stop,asks,fee){let f=fill(asks,amt);if(!f.ok)return null;let q=f.qty,g=(target-f.avg)*q,r=(stop-f.avg)*q,fees=amt*fee.m+q*target*fee.t,slip=(amt+q*target)*.0005;return{actual:g-fees-slip,risk:r-fees-slip,size:q,entryAvg:f.avg}}function plan(tf,bids,asks,c){let amt=Math.max(1,+$('amount').value||40),entry=c.ask,fee=FEES[+$('tier').value||0],h=depth(asks,5)/Math.max(1,depth(asks,35)),liq=depth(bids)+depth(asks),base=TFS[tf],strength=.65+Math.min(1.8,Math.abs(c.imb)/35),move=base*strength*(liq>250000?1.12:liq<25000?.8:1)*(c.momentum>3?1.08:c.momentum<-3?.85:1)*(h<.2?.72:1)*(c.sniper.quality>.68?1.1:c.sniper.quality<.38?.75:1),target=entry*(1+move),stop=entry*(1-Math.max(.0012,move*.52)),p=pnl(amt,entry,target,stop,asks,fee),required=p?p.risk?Math.abs(p.risk)/amt*.25+.0015:.002:99,th=tf==='1M'?14:tf==='5M'?12:8,ready=p&&p.actual>0&&move>required&&c.imb>th&&c.spreadSpike<2&&c.sniper.quality>=.48;let score=p?clamp(Math.round(Math.abs(c.imb)+20+(move-required)*2200+(p.actual/amt)*2500+(c.sniper.quality-.5)*30),0,100):0;return{tf,role:tf==='15M'?'Confirm':'Scout',side:'LONG',entry,target,stop,projectedPct:move*100,requiredPct:required*100,threshold:th,hollowFactor:h,wallFactor:1,spreadSpike:c.spreadSpike,imbalanceMomentum:c.momentum,volRatio:1,clear:ready,score,pnl:p,fee:{entryFee:fee.m,exitFee:fee.t},status:c.spreadSpike>=2?'HALT_SPREAD':c.sniper.quality<.48?'WAIT_SNIPER':ready?'READY':'NO SETUP',sniper:c.sniper}}function render(out){let b=out.best,ready=b&&b.clear;$('decision').textContent=ready?'READY LONG':'WAIT';$('decision').className='status '+(ready?'good':'warn');$('reason').textContent=ready?`${b.tf} clears sniper + friction gates.`:'Wait for READY LONG + SNIPER READY.';$('tf').textContent=b?.tf||'—';$('entry').textContent=fmt(b?.entry);$('target').textContent=fmt(b?.target);$('stop').textContent=fmt(b?.stop);$('net').textContent=b?.pnl?usd(b.pnl.actual):'—';$('net').className='value '+(b?.pnl?.actual>0?'good':'bad');$('sniper').innerHTML=`<b class="${out.ctx.sniper.quality>.68?'good':out.ctx.sniper.quality<.38?'bad':'warn'}">${out.ctx.sniper.verdict}</b><br>Quality ${out.ctx.sniper.quality.toFixed(2)} | Accel ${out.ctx.sniper.acceleration.toFixed(2)} | Exhaustion ${out.ctx.sniper.exhaustion.toFixed(2)}`;$('diag').textContent=`Imbalance ${out.ctx.imb.toFixed(2)} | Momentum ${out.ctx.momentum.toFixed(2)} | Spread spike ${out.ctx.spreadSpike.toFixed(2)}x | Samples ${mem.length}`;$('rows').innerHTML=out.plans.map(p=>`<tr class="${p.clear?'ready':'block'}"><td>${p.tf}</td><td>${fmt(p.entry)}</td><td>${fmt(p.target)}</td><td>${fmt(p.stop)}</td><td>${p.pnl?usd(p.pnl.actual):'—'}</td><td>${p.score}%</td><td>${p.status}</td></tr>`).join('');$('json').textContent=JSON.stringify({time:new Date().toISOString(),pair:$('pair').value,amount:out.amount,decision:ready?'READY_LONG':'WAIT',best:b,allIntervals:out.plans,diagnostics:out.ctx},null,2)}async function load(){try{$('conn').textContent='Live';let r=await fetch(`${API}/${$('pair').value}/book?level=2`,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let j=await r.json(),bids=j.bids.slice(0,100).map(x=>({p:+x[0],q:+x[1]})),asks=j.asks.slice(0,100).map(x=>({p:+x[0],q:+x[1]})),c=ctx(bids,asks),amount=Math.max(1,+$('amount').value||40),plans=Object.keys(TFS).map(tf=>plan(tf,bids,asks,c)),valid=plans.filter(x=>x.clear).sort((a,b)=>b.score-a.score),best=valid[0]||plans.slice().sort((a,b)=>b.score-a.score)[0];render({amount,ctx:c,plans,best})}catch(e){$('conn').textContent='Error';$('decision').textContent='DATA ERROR';$('reason').textContent=e.message;$('json').textContent=JSON.stringify({error:e.message},null,2)}}['pair','amount','tier'].forEach(id=>$(id).oninput=()=>{mem=[];load()});$('reload').onclick=load;load();setInterval(load,3000)})();</script><script src="anti-spoof-flow.js"></script><script src="version.js"></script></body></html>
